name: desktop-light-nsis

# Builds the Light (remote-only) Windows client as a NSIS installer on a real
# windows-latest host — the only shape that can produce the win32-only natives
# (get-windows binding, hud-modifier-monitor.exe).
#
# The workflow assumes this branch already carries `local-patches/`, and applies
# the patches at build time: that keeps the branch a thin layer over upstream
# `main`, so `git pull` upstream stays a fast-forward and no patch content has
# to be committed.

on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: 'electron-updater generic feed URL (directory holding latest.yml). Empty disables in-app updates.'
        required: false
        default: ''
      version:
        description: 'Installer version override (semver). Empty = upstream release tag + run number (e.g. 0.22.5-14).'
        required: false
        default: ''

concurrency:
  group: desktop-light-nsis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # upload the installer to a release (the update feed)
    timeout-minutes: 90
    env:
      CI: 'true'
      HERMES_DESKTOP_VARIANT: light
      HERMES_DESKTOP_WIN_TARGETS: nsis
      HERMES_UPDATE_FEED_URL: ${{ github.event.inputs.feed_url }}

    steps:
      # Windows runners default to core.autocrlf=true, which rewrites sources to
      # CRLF on checkout; pin LF so the tree matches what CI and the server build.
      - name: Force LF checkouts
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags: the installer version comes from the upstream tag

      # Upstream's ROOT package.json now requires node >=26 (and npm outside
      # 11.10.0-11.17.0): `npm ci` refuses to run on the 22 the desktop workspace
      # alone would accept.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Node toolchain
        run: node -v; npm -v

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      # apps/desktop/package.json ships version 0.0.0 — upstream injects the real
      # version at release time. Without this, latest.yml also says 0.0.0 and
      # electron-updater can never see a newer build (semver never increases).
      # Order: explicit input → nearest upstream tag → dated build number.
      - name: Set the installer version
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            # Track UPSTREAM's release line, taken from upstream's own tags.
            # `git describe` cannot be used: the fork tags its own builds
            # (v0.20261030.11-13 …), those tags are reachable, and describe then
            # happily returns our own artifact as the "upstream" version.
            $tags = git ls-remote --tags --refs https://github.com/NousResearch/hermes-agent.git 'v0.*' |
              ForEach-Object { ($_ -split 'refs/tags/')[1] } |
              ForEach-Object { $_.TrimStart('v') } |
              Where-Object { $_ -match '^\d+\.\d+\.\d+$' }
            $base = $tags | Sort-Object { [version]$_ } | Select-Object -Last 1
            if (-not $base) { $base = '0.0.0' }
            # Prerelease tail, not build metadata: `+` compares EQUAL to its base
            # in semver, so the updater would never fire; `-N` orders within a
            # line and still loses to a newer upstream release.
            $ver = "$base-$env:GITHUB_RUN_NUMBER"
          }
          "installer version: $ver  (package.json shipped $(node -p "require('./package.json').version"))"
          npm pkg set version=$ver

      - name: Typecheck (fails fast on a bad local patch)
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build renderer and main process
        working-directory: apps/desktop
        run: npm run build

      - name: Package the NSIS installer
        working-directory: apps/desktop
        # `npm run builder` is upstream's prepared-packaging wrapper: it admits
        # only the formats its preparation step acquired (dir/msix/zip on
        # Windows), so `--win nsis` is refused there with
        # "Argument is not admitted by prepared packaging". electron-builder
        # itself supports nsis and fetches its own tools, so call it directly.
        run: npx electron-builder --config electron-builder.config.cjs --win nsis --publish never

      # electron-builder only writes latest.yml for providers that carry a
      # channel of their own. With the generic provider (what this fork uses so
      # the client never touches the rate-limited GitHub API) `--publish never`
      # leaves no yml behind, and the release ends up with the installer but no
      # feed descriptor — the client then 404s on latest.yml. Generate it here so
      # the feed is provider-independent.
      - name: Ensure latest.yml exists
        shell: pwsh
        run: |
          $yml = 'apps/desktop/release/latest.yml'
          if (Test-Path $yml) { "already written by electron-builder"; return }
          $exe = Get-ChildItem apps/desktop/release -File | Where-Object { $_.Extension -eq '.exe' } | Select-Object -First 1
          if (-not $exe) { throw 'no installer found in apps/desktop/release' }
          $ver = node -p "require('./apps/desktop/package.json').version"
          $sha = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($exe.FullName)))
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          @(
            "version: $ver"
            "files:"
            "  - url: $($exe.Name)"
            "    sha512: $sha"
            "    size: $($exe.Length)"
            "path: $($exe.Name)"
            "sha512: $sha"
            "releaseDate: '$date'"
          ) | Set-Content -Path $yml -Encoding utf8
          "generated $yml for $($exe.Name) ($ver)"

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem apps/desktop/release -File | Select-Object Name, Length | Format-Table -AutoSize

      # The update feed IS this repo's Releases: latest.yml + the installer +
      # blockmaps are the assets electron-updater reads. Uploaded here rather
      # than by electron-builder's publisher so repeated builds of the same
      # version replace the assets instead of colliding with them.
      - name: Publish the update feed (GitHub release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $tag = "v$version"
          Write-Host "release tag: $tag"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Hermes Light $version" --notes "Automated NSIS build from $env:GITHUB_SHA."
          }
          $assets = @(Get-ChildItem apps/desktop/release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw 'no feed assets found (expected latest.yml + installer)' }
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          "feed assets published: $($assets.Count)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: hermes-light-nsis
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
